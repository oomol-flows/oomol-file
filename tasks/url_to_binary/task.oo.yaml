inputs_def:
  - handle: url
    description: "%initiate-an-http-request-to-download-the-contents-of-the-url-and%"
    json_schema:
      type: string
  - group: Options
    collapsed: true
  - handle: query
    json_schema:
      type: object
      additionalProperties:
        type: string
    value:
      {}
    nullable: false
  - handle: headers
    json_schema:
      type: object
      additionalProperties:
        type: string
    value:
      {}
    nullable: false
  - handle: timeout
    json_schema:
      type: integer
      minimum: 0
    value: 0
    nullable: false
  - handle: retry_times
    json_schema:
      type: integer
      minimum: 1
    value: 1
    nullable: false
outputs_def:
  - handle: binary
    description: "The downloaded binary content from the URL"
    json_schema:
      contentMediaType: oomol/bin
ui:
  default_width: 450
executor:
  name: nodejs
  options:
    entry: main.ts
    spawn: false
title: "%url-to-binary2%"
icon: ":carbon:cloud-data-ops:"
description: "Download content from a URL and output as binary data without saving to disk"
