ui:
  default_width: 450
inputs_def:
  - handle: files
    description: "%array-of-file-paths-to-filter%"
    json_schema:
      type: array
  - handle: type
    description: "%the-file-type-to-filter-by-image-video-audio-or-pdf%"
    json_schema:
      enum:
        - image
        - video
        - audio
        - pdf
      ui:options:
        labels:
          - Image
          - Video
          - Audio
          - PDF
    value:
    nullable: true
  - handle: filt_hide
    description: "%whether-to-filter-out-hidden-files-files-starting-with%"
    json_schema:
      type: boolean
    value: true
outputs_def:
  - handle: files
    description: "Array of filtered file paths matching the specified type"
    json_schema:
      type: array
executor:
  name: python
  options:
    entry: __init__.py
    spawn: false
title: "%filter-files2%"
icon: ":carbon:filter:"
description: "%filter-files-by-type-image-video-audio-pdf-from-a-list-of-file-p%"
