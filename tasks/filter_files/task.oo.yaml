ui:
  default_width: 450
inputs_def:
  - handle: files
    description: "Array of file paths to filter"
    json_schema:
      type: array
  - handle: type
    description: "The file type to filter by (image, video, audio, or PDF)"
    json_schema:
      enum:
        - image
        - video
        - audio
        - pdf
      ui:options:
        labels:
          - Image
          - Video
          - Audio
          - PDF
    value:
    nullable: true
  - handle: filt_hide
    description: "Whether to filter out hidden files (files starting with .)"
    json_schema:
      type: boolean
    value: true
outputs_def:
  - handle: files
    description: "Array of filtered file paths matching the specified type"
    json_schema:
      type: array
executor:
  name: python
  options:
    entry: __init__.py
    spawn: false
title: "%filter-files2%"
icon: ":carbon:filter:"
description: "Filter files by type (image, video, audio, PDF) from a list of file paths"
