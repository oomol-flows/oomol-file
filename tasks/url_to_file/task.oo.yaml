inputs_def:
  - handle: url
    description: ""
    json_schema:
      type: string
  - handle: file_dir
    description: "%specify-the-folder-path-where-the-file-will-be-saved-if-it-does%"
    json_schema:
      type: string
      ui:widget: dir
    value:
    nullable: true
